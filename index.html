<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff6f1" />
  <title>Feliz aniversário, mãe!</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #492d43;
      background: #fff6f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(255, 206, 194, 0.62), transparent 38%),
        radial-gradient(ellipse at 88% 85%, rgba(226, 204, 239, 0.7), transparent 40%),
        #fff6f1;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(36px, 8vw, 78px) clamp(24px, 8vw, 76px);
      text-align: center;
      border: 1px solid rgba(139, 91, 124, 0.18);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 70px rgba(106, 65, 99, 0.13);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #a45b78;
      font: 700 0.82rem/1.4 Arial, Helvetica, sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #673c5c;
      font-size: clamp(3rem, 11vw, 6.4rem);
      font-weight: 500;
      line-height: 0.98;
      text-wrap: balance;
    }

    .intro {
      max-width: 470px;
      margin: 24px auto 34px;
      color: #755f71;
      font-size: clamp(1.05rem, 3vw, 1.28rem);
      line-height: 1.7;
    }

    .celebrate-link {
      display: inline-flex;
      min-height: 68px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #c86682, #935a9c);
      box-shadow: 0 12px 28px rgba(166, 87, 126, 0.28);
      color: #fff;
      font: 700 clamp(1rem, 3.5vw, 1.2rem)/1.25 Arial, Helvetica, sans-serif;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .celebrate-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(166, 87, 126, 0.35);
    }

    .celebrate-link:focus-visible {
      outline: 3px solid #673c5c;
      outline-offset: 5px;
    }

    .heart {
      font-size: 1.35em;
      line-height: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Um dia todinho seu</p>
    <h1>Feliz aniversário, mãe!</h1>
    <p class="intro">Preparei um carinho em forma de palavras para celebrar a pessoa mais especial da minha vida.</p>
    <a class="celebrate-link" href="paginas/reportagem.html">
      <span class="heart" aria-hidden="true">♡</span>
      Feliz aniversário, clique aqui
    </a>
  </main>
</body>
</html>
